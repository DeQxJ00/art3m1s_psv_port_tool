name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FFMPEG_VERSION: 9.0.2
  FFMPEG_SOURCE_SHA256: 8C3850283EB25FA026482078A04051E0BE17347B09EF81A0849BEC15A96E002E
  BTBN_RELEASE_BASE: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
  DAV1D_VERSION: 1.5.4
  DAV1D_SOURCE_SHA256: A1D5B63D2D38EC9BD03ACF643CAA51FA22EDD1E89C5A109C4807717216BBEC07
  OGG_VERSION: 1.3.6
  OGG_SOURCE_SHA256: 5C8253428E181840CD20D41F3CA16557A9CC04BAD4A3D04CCE84808677FA1061
  THEORA_COMMIT: 8e4808736e9c181b971306cc3f05df9e61354004
  THEORA_SOURCE_SHA256: 83E1C8682D6496352286FA0967AEDA5D78C422110312D111CF99FDF03ED73DB0
  X264_COMMIT: b35605ace3ddf7c1a5d67a2eb553f034aef41d55
  ZLIB_VERSION: 1.3.2
  ZLIB_SOURCE_SHA256: D7A0654783A4DA529D1BB793B7AD9C3318020AF77667BCAE35F95D0E42A792F3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            extension: .exe
          - os: ubuntu-latest
            rid: linux-x64
            extension: ''
          - os: macos-15-intel
            rid: osx-x64
            extension: ''
          - os: macos-14
            rid: osx-arm64
            extension: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: Directory.Packages.props
      - id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: ffmpeg-install
          key: ffmpeg-${{ env.FFMPEG_VERSION }}-gpl-full-${{ matrix.rid }}-v5
      - shell: pwsh
        run: |
          Invoke-WebRequest "https://ffmpeg.org/releases/ffmpeg-${env:FFMPEG_VERSION}.tar.xz" -OutFile ffmpeg.tar.xz
          $actual = (Get-FileHash ffmpeg.tar.xz -Algorithm SHA256).Hash
          if ($actual -ne $env:FFMPEG_SOURCE_SHA256) { throw "FFmpeg source SHA-256 mismatch: $actual" }
          if ([OperatingSystem]::IsMacOS()) {
            Invoke-WebRequest "https://github.com/xiph/ogg/releases/download/v${env:OGG_VERSION}/libogg-${env:OGG_VERSION}.tar.xz" -OutFile libogg.tar.xz
            Invoke-WebRequest "https://github.com/xiph/theora/archive/${env:THEORA_COMMIT}.tar.gz" -OutFile libtheora.tar.gz
            Invoke-WebRequest "https://github.com/videolan/dav1d/archive/refs/tags/${env:DAV1D_VERSION}.tar.gz" -OutFile dav1d.tar.gz
            git init x264-source
            git -C x264-source remote add origin https://code.videolan.org/videolan/x264.git
            git -C x264-source fetch --no-tags --depth 1 origin $env:X264_COMMIT
            $x264Commit = (git -C x264-source rev-parse FETCH_HEAD).Trim()
            if ($x264Commit -ne $env:X264_COMMIT) { throw "x264 commit mismatch: $x264Commit" }
            git -C x264-source archive --format=tar.gz --prefix="x264-${env:X264_COMMIT}/" $x264Commit -o ../x264.tar.gz
            Invoke-WebRequest "https://zlib.net/zlib-${env:ZLIB_VERSION}.tar.xz" -OutFile zlib.tar.xz
            $sources = @{
              'libogg.tar.xz' = $env:OGG_SOURCE_SHA256
              'libtheora.tar.gz' = $env:THEORA_SOURCE_SHA256
              'dav1d.tar.gz' = $env:DAV1D_SOURCE_SHA256
              'zlib.tar.xz' = $env:ZLIB_SOURCE_SHA256
            }
            foreach ($item in $sources.GetEnumerator()) {
              $hash = (Get-FileHash $item.Key -Algorithm SHA256).Hash
              if ($hash -ne $item.Value) { throw "$($item.Key) source SHA-256 mismatch: $hash" }
            }
          }
      - if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install autoconf automake libtool meson nasm ninja pkg-config
      - if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$PWD/ffmpeg-deps"
          tar -xf zlib.tar.xz
          (cd "zlib-${ZLIB_VERSION}" && ./configure --prefix="$prefix" --static && make -j2 && make install)
          tar -xf libogg.tar.xz
          (cd "libogg-${OGG_VERSION}" && ./configure --prefix="$prefix" --disable-shared --enable-static && make -j2 && make install)
          tar -xf libtheora.tar.gz
          (cd "theora-${THEORA_COMMIT}" && ./autogen.sh && PKG_CONFIG_PATH="$prefix/lib/pkgconfig" ./configure --prefix="$prefix" --disable-shared --enable-static --disable-examples --disable-oggtest --disable-vorbistest --disable-spec --disable-doc && make -j2 && make install)
          tar -xf x264.tar.gz
          (cd "x264-${X264_COMMIT}" && ./configure --prefix="$prefix" --enable-static --disable-cli --disable-opencl && make -j2 && make install)
          tar -xf dav1d.tar.gz
          meson setup dav1d-build "dav1d-${DAV1D_VERSION}" --prefix="$prefix" --default-library=static -Denable_tools=false -Denable_tests=false
          ninja -C dav1d-build -j2 install
          tar -xf ffmpeg.tar.xz
          cd "ffmpeg-${FFMPEG_VERSION}"
          PKG_CONFIG_PATH="$prefix/lib/pkgconfig" ./configure --prefix="$PWD/../ffmpeg-install" --disable-shared --enable-static --disable-doc --disable-debug --disable-autodetect --disable-nonfree --disable-x86asm --pkg-config-flags=--static --enable-gpl --enable-zlib --enable-libdav1d --enable-libtheora --enable-libx264 --extra-version=art3m1s-gpl-full
          make -j2
          make install
      - if: runner.os != 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $platform = if ([OperatingSystem]::IsWindows()) { 'win64' } else { 'linux64' }
          $extension = if ([OperatingSystem]::IsWindows()) { 'zip' } else { 'tar.xz' }
          $archive = "ffmpeg-n9.0-latest-$platform-gpl-9.0.$extension"
          Invoke-WebRequest "$env:BTBN_RELEASE_BASE/checksums.sha256" -OutFile btbn-checksums.sha256
          $checksumLine = Get-Content btbn-checksums.sha256 | Where-Object { $_ -match [regex]::Escape($archive) }
          if (-not $checksumLine) { throw "BtbN checksum entry is missing for $archive" }
          $expected = ($checksumLine -split '\s+')[0].ToUpperInvariant()
          Invoke-WebRequest "$env:BTBN_RELEASE_BASE/$archive" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "BtbN FFmpeg SHA-256 mismatch: $actual" }
          if ([OperatingSystem]::IsWindows()) { Expand-Archive $archive -DestinationPath btbn-ffmpeg }
          else { New-Item -ItemType Directory btbn-ffmpeg | Out-Null; tar -xf $archive -C btbn-ffmpeg }
          $ffmpeg = Get-ChildItem btbn-ffmpeg -Recurse -File | Where-Object Name -eq $(if ([OperatingSystem]::IsWindows()) { 'ffmpeg.exe' } else { 'ffmpeg' }) | Select-Object -First 1
          if (-not $ffmpeg) { throw 'BtbN archive does not contain ffmpeg.' }
          $bundleRoot = Split-Path (Split-Path $ffmpeg.FullName)
          New-Item -ItemType Directory -Force ffmpeg-install/bin | Out-Null
          Copy-Item "$bundleRoot/bin/ffmpeg*" ffmpeg-install/bin
          Copy-Item "$bundleRoot/LICENSE.txt" ffmpeg-install/BTBN-LICENSE.txt
          Copy-Item btbn-checksums.sha256 ffmpeg-install/BTBN-checksums.sha256
      - run: dotnet test art3m1s_psv_port_tool.slnx -c Release
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: dotnet publish src/Art3m1s.PsvTool.App/Art3m1s.PsvTool.App.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:PublishSingleFile=true -o publish/${{ matrix.rid }}
      - shell: pwsh
        run: |
          $toolDir = "publish/${{ matrix.rid }}/tools"
          New-Item -ItemType Directory -Force $toolDir | Out-Null
          $suffix = '${{ matrix.extension }}'
          Copy-Item "ffmpeg-install/bin/ffmpeg$suffix" "$toolDir/ffmpeg$suffix"
          Copy-Item "ffmpeg-install/bin/ffprobe$suffix" "$toolDir/ffprobe$suffix"
          if (-not [OperatingSystem]::IsWindows()) {
            chmod +x "$toolDir/ffmpeg$suffix" "$toolDir/ffprobe$suffix"
          }
          foreach ($tool in @("ffmpeg$suffix","ffprobe$suffix")) {
            $hash = (Get-FileHash "$toolDir/$tool" -Algorithm SHA256).Hash
            "$hash  $tool" | Set-Content "$toolDir/$tool.sha256" -NoNewline
          }
          & "$toolDir/ffmpeg$suffix" -hide_banner -buildconf 2>&1 | Out-File "$toolDir/BUILD-CONFIG.txt"
          $config = Get-Content "$toolDir/BUILD-CONFIG.txt" -Raw
          if ($config -notmatch '--enable-gpl' -or $config -match '--enable-nonfree') { throw 'Expected redistributable GPL FFmpeg Full configuration.' }
          $encoders = & "$toolDir/ffmpeg$suffix" -hide_banner -encoders 2>&1 | Out-String
          if ($encoders -notmatch 'libx264' -or $encoders -notmatch 'libtheora') { throw 'FFmpeg Full is missing libx264 or libtheora.' }
          $decoders = & "$toolDir/ffmpeg$suffix" -hide_banner -decoders 2>&1 | Out-String
          if ($decoders -notmatch 'libdav1d') { throw 'FFmpeg Full is missing the libdav1d software AV1 decoder.' }
          $smoke = Join-Path ([IO.Path]::GetTempPath()) "art3m1s-theora-smoke.ogv"
          try {
            & "$toolDir/ffmpeg$suffix" -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=320x180:rate=30:duration=1' -an -c:v libtheora -pix_fmt yuv420p -q:v 8 $smoke
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg Full failed the Theora encode smoke test.' }
            & "$toolDir/ffmpeg$suffix" -hide_banner -xerror -loglevel error -i $smoke -map 0:v:0 -f null -
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg Full produced a damaged Theora stream.' }
          } finally {
            Remove-Item -LiteralPath $smoke -Force -ErrorAction SilentlyContinue
          }
      - shell: pwsh
        run: |
          $suffix = '${{ matrix.extension }}'
          $binary = (Resolve-Path "publish/${{ matrix.rid }}/Art3m1s.PsvTool.App$suffix").Path
          $process = Start-Process -FilePath $binary -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Native self-test failed: $($process.ExitCode)" }
      - shell: pwsh
        run: |
          Copy-Item LICENSE "publish/${{ matrix.rid }}"
          Copy-Item "publish/${{ matrix.rid }}/tools/BUILD-CONFIG.txt" "publish/${{ matrix.rid }}/FFMPEG-BUILD-CONFIG.txt"
          ./scripts/collect-third-party-licenses.ps1 -PublishDirectory "publish/${{ matrix.rid }}" -RuntimeIdentifier "${{ matrix.rid }}" -FfmpegSourceArchive ffmpeg.tar.xz -FfmpegVersion $env:FFMPEG_VERSION
          if (Test-Path ffmpeg-install/BTBN-LICENSE.txt) {
            Copy-Item ffmpeg-install/BTBN-LICENSE.txt "publish/${{ matrix.rid }}/licenses/BtbN-FFmpeg-Builds-GPLv3.txt"
            Copy-Item ffmpeg-install/BTBN-checksums.sha256 "publish/${{ matrix.rid }}/tools/BTBN-checksums.sha256"
          }
          if ('${{ matrix.rid }}' -eq 'win-x64') {
            $files = @(
              "publish/${{ matrix.rid }}/Art3m1s.PsvTool.App.exe",
              "publish/${{ matrix.rid }}/LICENSE",
              "publish/${{ matrix.rid }}/FFMPEG-BUILD-CONFIG.txt",
              "publish/${{ matrix.rid }}/tools",
              "publish/${{ matrix.rid }}/licenses"
            )
            Compress-Archive -Path $files -DestinationPath "art3m1s_psv_port_tool-${{ matrix.rid }}.zip"
          }
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x publish/${{ matrix.rid }}/Art3m1s.PsvTool.App
          cd publish/${{ matrix.rid }}
          zip -9r ../../art3m1s_psv_port_tool-${{ matrix.rid }}.zip Art3m1s.PsvTool.App LICENSE FFMPEG-BUILD-CONFIG.txt tools licenses
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          app=bundle/art3m1s_psv_port_tool.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          iconset=bundle/app-icon.iconset
          mkdir -p "$iconset"
          sips -z 16 16 src/Art3m1s.PsvTool.App/Assets/app-icon.png --out "$iconset/icon_16x16.png"
          sips -z 32 32 src/Art3m1s.PsvTool.App/Assets/app-icon.png --out "$iconset/icon_16x16@2x.png"
          sips -z 32 32 src/Art3m1s.PsvTool.App/Assets/app-icon.png --out "$iconset/icon_32x32.png"
          sips -z 64 64 src/Art3m1s.PsvTool.App/Assets/app-icon.png --out "$iconset/icon_32x32@2x.png"
          sips -z 128 128 src/Art3m1s.PsvTool.App/Assets/app-icon.png --out "$iconset/icon_128x128.png"
          sips -z 256 256 src/Art3m1s.PsvTool.App/Assets/app-icon.png --out "$iconset/icon_128x128@2x.png"
          sips -z 256 256 src/Art3m1s.PsvTool.App/Assets/app-icon.png --out "$iconset/icon_256x256.png"
          sips -z 512 512 src/Art3m1s.PsvTool.App/Assets/app-icon.png --out "$iconset/icon_256x256@2x.png"
          sips -z 512 512 src/Art3m1s.PsvTool.App/Assets/app-icon.png --out "$iconset/icon_512x512.png"
          cp src/Art3m1s.PsvTool.App/Assets/app-icon.png "$iconset/icon_512x512@2x.png"
          iconutil -c icns "$iconset" -o "$app/Resources/app-icon.icns"
          cp packaging/macos/Info.plist "$app/Info.plist"
          cp publish/${{ matrix.rid }}/Art3m1s.PsvTool.App "$app/MacOS/art3m1s_psv_port_tool"
          find publish/${{ matrix.rid }} -maxdepth 1 -name '*.dylib' -exec cp {} "$app/MacOS/" \;
          chmod +x "$app/MacOS/art3m1s_psv_port_tool"
          cp publish/${{ matrix.rid }}/LICENSE publish/${{ matrix.rid }}/FFMPEG-BUILD-CONFIG.txt "$app/Resources"
          cp -R publish/${{ matrix.rid }}/tools "$app/MacOS/tools"
          cp -R publish/${{ matrix.rid }}/licenses "$app/Resources/licenses"
          cd bundle
          zip -9yr ../art3m1s_psv_port_tool-${{ matrix.rid }}.app.zip art3m1s_psv_port_tool.app
      - uses: anchore/sbom-action@v0
        with:
          path: publish/${{ matrix.rid }}
          format: spdx-json
          output-file: art3m1s_psv_port_tool-${{ matrix.rid }}.spdx.json
      - shell: pwsh
        run: |
          $archive = Get-ChildItem "art3m1s_psv_port_tool-${{ matrix.rid }}*.zip" | Select-Object -First 1
          (Get-FileHash $archive -Algorithm SHA256).Hash + "  " + $archive.Name | Set-Content "SHA256-${{ matrix.rid }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            art3m1s_psv_port_tool-${{ matrix.rid }}*.zip
            art3m1s_psv_port_tool-${{ matrix.rid }}.spdx.json
            SHA256-${{ matrix.rid }}.txt

  codec-sources:
    runs-on: ubuntu-latest
    steps:
      - shell: pwsh
        run: |
          Invoke-WebRequest "https://ffmpeg.org/releases/ffmpeg-${env:FFMPEG_VERSION}.tar.xz" -OutFile "ffmpeg-${env:FFMPEG_VERSION}.tar.xz"
          $actual = (Get-FileHash "ffmpeg-${env:FFMPEG_VERSION}.tar.xz" -Algorithm SHA256).Hash
          if ($actual -ne $env:FFMPEG_SOURCE_SHA256) { throw "FFmpeg source SHA-256 mismatch: $actual" }
          Invoke-WebRequest "https://github.com/xiph/ogg/releases/download/v${env:OGG_VERSION}/libogg-${env:OGG_VERSION}.tar.xz" -OutFile "libogg-${env:OGG_VERSION}.tar.xz"
          Invoke-WebRequest "https://github.com/xiph/theora/archive/${env:THEORA_COMMIT}.tar.gz" -OutFile "libtheora-1.2.0.tar.gz"
          Invoke-WebRequest "https://github.com/videolan/dav1d/archive/refs/tags/${env:DAV1D_VERSION}.tar.gz" -OutFile "dav1d-${env:DAV1D_VERSION}.tar.gz"
          git init x264-source
          git -C x264-source remote add origin https://code.videolan.org/videolan/x264.git
          git -C x264-source fetch --no-tags --depth 1 origin $env:X264_COMMIT
          $x264Commit = (git -C x264-source rev-parse FETCH_HEAD).Trim()
          if ($x264Commit -ne $env:X264_COMMIT) { throw "x264 commit mismatch: $x264Commit" }
          git -C x264-source archive --format=tar.gz --prefix="x264-${env:X264_COMMIT}/" $x264Commit -o "../x264-${env:X264_COMMIT}.tar.gz"
          Invoke-WebRequest "https://zlib.net/zlib-${env:ZLIB_VERSION}.tar.xz" -OutFile "zlib-${env:ZLIB_VERSION}.tar.xz"
          $sources = @{
            "ffmpeg-${env:FFMPEG_VERSION}.tar.xz" = $env:FFMPEG_SOURCE_SHA256
            "libogg-${env:OGG_VERSION}.tar.xz" = $env:OGG_SOURCE_SHA256
            'libtheora-1.2.0.tar.gz' = $env:THEORA_SOURCE_SHA256
            "dav1d-${env:DAV1D_VERSION}.tar.gz" = $env:DAV1D_SOURCE_SHA256
            "zlib-${env:ZLIB_VERSION}.tar.xz" = $env:ZLIB_SOURCE_SHA256
          }
          $lines = foreach ($item in $sources.GetEnumerator()) {
            $hash = (Get-FileHash $item.Key -Algorithm SHA256).Hash
            if ($hash -ne $item.Value) { throw "$($item.Key) source SHA-256 mismatch: $hash" }
            "$hash  $($item.Key)"
          }
          $x264Archive = "x264-${env:X264_COMMIT}.tar.gz"
          $x264Hash = (Get-FileHash $x264Archive -Algorithm SHA256).Hash
          $lines += "$x264Hash  $x264Archive"
          $lines | Sort-Object | Set-Content CODEC-SOURCES-SHA256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-codec-sources
          path: |
            ffmpeg-${{ env.FFMPEG_VERSION }}.tar.xz
            libogg-${{ env.OGG_VERSION }}.tar.xz
            libtheora-1.2.0.tar.gz
            dav1d-${{ env.DAV1D_VERSION }}.tar.gz
            x264-${{ env.X264_COMMIT }}.tar.gz
            zlib-${{ env.ZLIB_VERSION }}.tar.xz
            CODEC-SOURCES-SHA256.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, codec-sources]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: cat dist/SHA256-*.txt > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Windows and Linux packages include standalone BtbN FFmpeg/ffprobe n9.0 GPL Full static binaries with libdav1d, libx264, and libtheora. macOS packages use the equivalent source-built codec set. No nonfree components are enabled.
            Corresponding FFmpeg, dav1d, x264, libtheora, libogg, and zlib sources are attached; license texts, build configuration, provider checksums, and application-package checksums are included with the release.
